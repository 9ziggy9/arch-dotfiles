# tinty: one base16/base24 color scheme for everything. Pick one with
# theme-select ($mod+Shift+t), or run `theme-select base16-nord`.
#
# tinty keeps the schemes and remembers the current one. Its one item hands
# the chosen scheme, as JSON, to apply-scheme (next to this directory), which
# adjusts any colors that wouldn't read, fills in every program's template
# (../templates) and reloads the programs. The JSON is rendered for every
# scheme ahead of time by `tinty build`, which theme-select runs whenever
# the scheme template changes. (Hooks run inside sh -c '...': no single
# quotes in them.)

default-scheme = "base16-solarized-dark"

[[items]]
name = "scheme"
path = "~/.config/tinted-theming/scheme"
themes-dir = "themes"
supported-systems = ["base16", "base24"]
hook = "python3 -I ~/.config/tinted-theming/apply-scheme \"$TINTY_THEME_FILE_PATH\""
