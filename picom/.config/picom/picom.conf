# picom: compositor, here only to recolor the Boox mirror window.
#
# The Boox panel is dark through Android's color inversion, which happens
# after scrcpy captures the screen, so the mirror arrives light. A shader
# recolors the scrcpy window in the current color scheme: paper becomes the
# background, ink the text color, colored ink the nearest accent. The shader
# (boox.glsl, next to this file) is written by theme-select, which restarts
# picom with it. Nothing else is changed: no shadows, fading, transparency
# or blur.

backend = "glx";
vsync = true;

shadow = false;
fading = false;

# keep compositing fullscreen windows, or the Boox window (fullscreen on
# workspace 10) would skip the shader
unredir-if-possible = false;

rules = (
  { match = "class_g = 'scrcpy'"; shader = "boox.glsl"; },
);
