# picom: compositor, here only to invert the Boox mirror window.
#
# The Boox panel is dark through Android's color inversion, which happens
# after scrcpy captures the screen, so the mirror arrives light. Inverting the
# scrcpy window here makes it match the panel. Nothing else is changed: no
# shadows, fading, transparency or blur.

backend = "glx";
vsync = true;

shadow = false;
fading = false;

# keep compositing fullscreen windows, or the Boox window (fullscreen on
# workspace 10) would skip the inversion
unredir-if-possible = false;

rules = (
  { match = "class_g = 'scrcpy'"; invert-color = true; },
);
