# Kitty Terminal Config

# Font: the family is picked with font-select ($mod+Shift+f) and written to
# current-theme.conf with the colors (below); the size is kitty's own
font_size        10.0

# Cursor
cursor_shape          block
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0

# Window
window_padding_width    8
remember_window_size    yes

# Tab bar
tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     slanted

# Colors: the color scheme, written by tinty (theme-select, $mod+Shift+t)
include current-theme.conf

# Vim copy mode: Alt+Esc opens the scrollback in Neovim (~/.config/kitty/
# pager.lua): v/V/Ctrl+v to select, y copies to the clipboard, q closes
scrollback_pager /usr/bin/nvim -u /home/ziggy/.config/kitty/pager.lua -n -i NONE --noplugin -
map alt+escape    show_scrollback

# Command palette, like Emacs' M-x: fuzzy search over every kitty action
map alt+x         command_palette

# Zoom text without Shift, like Emacs (kitty's Ctrl+Shift versions still work)
map ctrl+equal    change_font_size all +1.0
map ctrl+plus     change_font_size all +1.0
map ctrl+minus    change_font_size all -1.0
map ctrl+0        change_font_size all 0

# Tab bindings, all on Alt (i3 uses none; qutebrowser uses the same keys).
# Alt+Enter here means Claude Code etc. can't use it for a new line: use
# Shift+Enter or a trailing \ there instead.
map alt+enter     new_tab
map alt+w         close_tab
map alt+h         previous_tab
map alt+l         next_tab
map alt+shift+h   move_tab_backward
map alt+shift+l   move_tab_forward
map alt+r         set_tab_title
# Alt+N: go to tab N, or open a new tab if there isn't one yet (like i3)
map alt+1         kitten goto_or_new_tab.py 1
map alt+2         kitten goto_or_new_tab.py 2
map alt+3         kitten goto_or_new_tab.py 3
map alt+4         kitten goto_or_new_tab.py 4
map alt+5         kitten goto_or_new_tab.py 5
map alt+6         kitten goto_or_new_tab.py 6
map alt+7         kitten goto_or_new_tab.py 7
map alt+8         kitten goto_or_new_tab.py 8
map alt+9         kitten goto_or_new_tab.py 9
